services:
  - type: web
    name: incidentdesk
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: YOLO_IMGSZ
        value: "256"
      - key: SAMPLE_FPS
        value: "1.5"
      - key: ANALYSIS_SPEED
        value: "0"
