services:
  - type: web
    name: incidentdesk
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/state
    envVars:
      - key: PORT
        value: 10000
      - key: YOLO_IMGSZ
        value: "320"
      - key: SAMPLE_FPS
        value: "2.5"
      - key: ANALYSIS_SPEED
        value: "8"
